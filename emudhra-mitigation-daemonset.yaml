apiVersion: v1
kind: ConfigMap
metadata:
  name: emudhra-ca-mitigation
  namespace: kube-system
data:
  mitigate.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    export LC_ALL=C
    umask 077
    CERT_DIR=/etc/ssl/certs
    STATE=/var/lib/yc-emudhra-mitigation
    MARKER=$STATE/restart-state-v3
    REQUIRED=$STATE/restart-required-v3
    WORK=$(mktemp -d /tmp/emudhra.XXXXXXXX)
    trap 'rm -rf -- "$WORK"' EXIT
    trap 'echo "FAIL: mitigation failed at line $LINENO" >&2' ERR
    BLOCKED='86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4'
    declare -A fingerprints=()

    fail() { echo "FAIL: $*" >&2; exit 1; }
    file_hash() { sha256sum -- "$1" | cut -d ' ' -f 1; }

    # Temp file and destination share a filesystem. Replace symlinks, not targets.
    atomic_copy() {
        local source=$1 dest=$2 mode=${3:-600} tmp
        tmp=$(mktemp "${dest%/*}/.emudhra.XXXXXXXX")
        cp -- "$source" "$tmp"
        chmod "$mode" "$tmp"
        sync "$tmp"
        mv -fT -- "$tmp" "$dest"
        sync -f "${dest%/*}"
    }

    # Output line ranges of distrusted PEM blocks; collect all retained fingerprints.
    # Parse each certificate with OpenSSL. Cache identical blocks within this run.
    scan_file() {
        local file=$1 cert hash fingerprint first last
        rm -rf -- "$WORK/parts"
        mkdir "$WORK/parts"
        awk -v dir="$WORK/parts" '
          /^-----BEGIN CERTIFICATE-----\r?$/ {
            if (inside) exit 2
            inside=1; first=NR; count++; out=dir "/" count ".pem"
          }
          inside { print $0 > out }
          /^-----END CERTIFICATE-----\r?$/ {
            if (!inside) exit 2
            close(out); print first, NR, out; inside=0
          }
          END { if (inside) exit 2 }
        ' "$file" > "$WORK/parts/index"
        : > "$WORK/ranges"
        while read -r first last cert; do
            hash=$(file_hash "$cert")
            fingerprint=${fingerprints[$hash]:-}
            if [[ -z $fingerprint ]]; then
                fingerprint=$(openssl x509 -in "$cert" -outform DER | sha256sum | cut -d ' ' -f 1)
                fingerprints[$hash]=$fingerprint
            fi
            if [[ " $BLOCKED " == *" $fingerprint "* ]]; then
                printf '%s %s\n' "$first" "$last" >> "$WORK/ranges"
            else
                printf '%s\n' "$fingerprint" >> "$WORK/hashes"
            fi
        done < "$WORK/parts/index"
    }

    verify_store() {
        local file
        : > "$WORK/hashes"
        [[ -s $CERT_DIR/ca-certificates.crt ]] || fail 'Missing or empty CA bundle'
        openssl crl2pkcs7 -nocrl -certfile "$CERT_DIR/ca-certificates.crt" -out "$WORK/bundle.p7b"
        grep -q '^-----BEGIN CERTIFICATE-----' "$CERT_DIR/ca-certificates.crt" || fail 'No CA in bundle'
        for file in "$CERT_DIR"/*; do
            [[ -f $file ]] || continue
            scan_file "$file"
            [[ ! -s $WORK/ranges ]] || fail "Distrusted CA remains in $file"
        done
        STORE_DIGEST=$(sort -u "$WORK/hashes" | sha256sum | cut -d ' ' -f 1)
    }

    clean_store() {
        local file n=0 i old mode name
        local -a paths=() hashes=() modes=()
        : > "$WORK/hashes"
        # Prepare the entire plan before touching the host store.
        for file in "$CERT_DIR"/*; do
            [[ -f $file ]] || continue
            old=$(file_hash "$file")
            scan_file "$file"
            [[ -s $WORK/ranges ]] || continue
            paths+=("$file"); hashes+=("$old"); modes+=("$(stat -Lc '%a' "$file")")
            cp -- "$file" "$WORK/before-$n"
            awk 'FILENAME==ARGV[1] { for (i=$1;i<=$2;i++) drop[i]=1; next }
                 !(FNR in drop) { print }' "$WORK/ranges" "$file" > "$WORK/after-$n"
            if [[ $file == "$CERT_DIR/ca-certificates.crt" ]]; then
                grep -q '^-----BEGIN CERTIFICATE-----' "$WORK/after-$n" || fail 'Filtering would empty CA bundle'
                openssl crl2pkcs7 -nocrl -certfile "$WORK/after-$n" -out "$WORK/bundle.p7b"
            fi
            n=$((n+1))
        done
        (( n > 0 )) || return 0
        # Even restoring the previous CA digest needs a new runtime restart:
        # a runtime may have loaded the reintroduced CA in the meantime.
        printf 'invalid\n' > "$WORK/invalid"
        atomic_copy "$WORK/invalid" "$MARKER"
        rm -f -- "$STATE/restart-containerd-v3" "$STATE/restart-dockerd-v3"
        sync -f "$STATE"
        for ((i=0;i<n;i++)); do
            file=${paths[$i]}; name=${file##*/}
            if [[ ! -e $file && -L $file ]]; then
                rm -- "$file" # Its distrusted target was removed earlier in this plan.
                continue
            fi
            [[ -f $file && $(file_hash "$file") == "${hashes[$i]}" ]] || fail "CA store changed concurrently: $file"
            [[ -e $STATE/before-$name ]] || atomic_copy "$WORK/before-$i" "$STATE/before-$name"
            if grep -q '^-----BEGIN CERTIFICATE-----' "$WORK/after-$i"; then
                atomic_copy "$WORK/after-$i" "$file" "${modes[$i]}"
            else
                rm -- "$file"
                sync -f "$CERT_DIR"
            fi
            echo "Removed distrusted certificate(s) from $file"
        done
    }

    # Select only root daemons belonging to the host systemd services.
    # Docker's private containerd is managed by dockerd, not signalled separately.
    identity() {
        local pid=$1 runtime=$2 service=$2 comm stat rest uid
        [[ $runtime != dockerd ]] || service=docker
        [[ -r /proc/$pid/comm ]] || return 0
        read -r comm < "/proc/$pid/comm" || return 0
        [[ $comm == "$runtime" ]] || return 0
        grep -q ":/.*system.slice/$service.service$" "/proc/$pid/cgroup" 2>/dev/null || return 0
        uid=$(awk '/^Uid:/ { print $2 ":" $3 }' "/proc/$pid/status" 2>/dev/null) || return 0
        [[ $uid == 0:0 ]] || return 0
        IFS= read -r stat < "/proc/$pid/stat" || return 0
        rest=${stat##*) }
        local -a fields
        read -ra fields <<< "$rest"
        printf '%s:%s:%s\n' "$(cat /proc/sys/kernel/random/boot_id)" "$pid" "${fields[19]}"
    }

    find_runtime() {
        local runtime=$1 proc comm candidate found=''
        for proc in /proc/[0-9]*; do
            [[ -r $proc/comm ]] || continue
            read -r comm < "$proc/comm" 2>/dev/null || continue
            [[ $comm == "$runtime" ]] || continue
            candidate=$(identity "${proc##*/}" "$runtime")
            [[ -n $candidate ]] || continue
            [[ -z $found ]] || fail "Ambiguous $runtime process in host systemd service"
            found=$candidate
        done
        printf '%s' "$found"
    }

    restart_runtime() {
        local runtime=$1 digest=$2 journal=$STATE/restart-$1-v3 current old='' status='' saved='' pid deadline new
        current=$(find_runtime "$runtime")
        if [[ -f $journal ]]; then
            { read -r saved; read -r status; read -r old; } < "$journal"
        fi
        if [[ $saved == "$digest" && $status == done && -n $current ]]; then
            return 0
        fi
        if [[ $saved != "$digest" ]]; then
            [[ -n $current ]] || fail "$runtime missing before restart"
            old=$current
            printf '%s\npending\n%s\n' "$digest" "$old" > "$WORK/journal"
            atomic_copy "$WORK/journal" "$journal"
        fi
        if [[ $current == "$old" ]]; then
            pid=${old#*:}; pid=${pid%%:*}
            [[ $(identity "$pid" "$runtime") == "$old" ]] || fail "$runtime identity changed before SIGTERM; retry"
            kill -TERM "$pid"
            echo "Sent SIGTERM to $runtime PID $pid; waiting for systemd"
        fi
        deadline=$((SECONDS+120))
        while (( SECONDS < deadline )); do
            new=$(find_runtime "$runtime")
            if [[ -n $new && $new != "$old" ]]; then
                sleep 5
                if [[ $(find_runtime "$runtime") == "$new" ]]; then
                    printf '%s\ndone\n%s\n' "$digest" "$new" > "$WORK/journal"
                    atomic_copy "$WORK/journal" "$journal"
                    echo "$runtime restarted: $new"
                    return 0
                fi
            fi
            sleep 1
        done
        fail "$runtime did not recover; restore the service on the node"
    }

    check() {
        local digest runtime count=0
        verify_store
        [[ -f $MARKER && ! -e $REQUIRED ]] || fail 'Runtime restart verification incomplete'
        {
            read -r digest
            [[ $digest == "$STORE_DIGEST" ]] || fail 'CA store changed since runtime restart'
            while read -r runtime; do
                [[ $runtime == containerd || $runtime == dockerd ]] || fail 'Invalid runtime state'
                [[ -n $(find_runtime "$runtime") ]] || fail "$runtime is not running"
                count=$((count+1))
            done
        } < "$MARKER"
        (( count > 0 )) || fail 'No runtime recorded'
    }

    apply() {
        local runtime digest old_digest='' current names=''
        mkdir -p "$STATE"
        exec 9> "$STATE/lock-v3"
        flock -n 9 || fail 'Another mitigation is running'
        clean_store
        verify_store
        digest=$STORE_DIGEST
        [[ ! -f $MARKER ]] || read -r old_digest < "$MARKER"
        if [[ $old_digest != "$digest" || -e $REQUIRED ]]; then
            if [[ -e $REQUIRED ]]; then
                names=$(tail -n +2 "$REQUIRED")
            fi
            for runtime in containerd dockerd; do
                current=$(find_runtime "$runtime")
                [[ -z $current ]] || names+=$'\n'"$runtime"
            done
            names=$(printf '%s\n' "$names" | sed '/^$/d' | sort -u)
            [[ -n $names ]] || fail 'No host containerd or dockerd service found'
            printf '%s\n%s\n' "$digest" "$names" > "$WORK/required"
            atomic_copy "$WORK/required" "$REQUIRED"
            while read -r runtime; do
                [[ $runtime == containerd || $runtime == dockerd ]] || fail 'Invalid runtime journal'
                restart_runtime "$runtime" "$digest"
            done <<< "$names"
            verify_store
            [[ $STORE_DIGEST == "$digest" ]] || fail 'CA store changed during runtime restart'
            atomic_copy "$WORK/required" "$MARKER"
            rm -- "$REQUIRED"
            sync -f "$STATE"
        fi
        check
        echo 'PASS: affected roots absent; runtimes running with verified CA store'
    }

    case ${1:-} in
        apply) apply ;;
        check) check ;;
        *) fail 'Usage: mitigate.sh apply|check' ;;
    esac
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: emudhra-ca-mitigation
  namespace: kube-system
  labels:
    app: emudhra-ca-mitigation
spec:
  selector:
    matchLabels:
      app: emudhra-ca-mitigation
  minReadySeconds: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        container.apparmor.security.beta.kubernetes.io/mitigate: unconfined
      labels:
        app: emudhra-ca-mitigation
    spec:
      hostPID: true
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      terminationGracePeriodSeconds: 150
      containers:
      - name: mitigate
        image: cr.yandex/yc/mk8s-openssl:stable
        imagePullPolicy: Never
        securityContext:
          privileged: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: SCRIPT_SHA256
          value: cf9747e723125372dfde971896fef047825afd9b0e5a36736012b7aabd857f1e
        command:
        - bash
        - -c
        - |
          set -Eeuo pipefail
          mode=$1
          while true; do
              # The sentinel preserves trailing newlines in the in-memory snapshot.
              source=$(cat /opt/mitigation/mitigate.sh; printf '.')
              source=${source%.}
              actual=$(printf '%s' "$source" | sha256sum | cut -d ' ' -f 1)
              if [[ $actual != "$SCRIPT_SHA256" ]]; then
                  echo 'FAIL: mitigation script SHA-256 mismatch; refusing execution' >&2
                  exit 1
              fi
              run_mode=$mode
              [[ $mode != loop ]] || run_mode=apply
              bash -c "$source" mitigation "$run_mode"
              [[ $mode == loop ]] || break
              sleep 3600
          done
        - launcher
        - loop
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - |
              set -Eeuo pipefail
              mode=$1
              while true; do
                  # The sentinel preserves trailing newlines in the in-memory snapshot.
                  source=$(cat /opt/mitigation/mitigate.sh; printf '.')
                  source=${source%.}
                  actual=$(printf '%s' "$source" | sha256sum | cut -d ' ' -f 1)
                  if [[ $actual != "$SCRIPT_SHA256" ]]; then
                      echo 'FAIL: mitigation script SHA-256 mismatch; refusing execution' >&2
                      exit 1
                  fi
                  run_mode=$mode
                  [[ $mode != loop ]] || run_mode=apply
                  bash -c "$source" mitigation "$run_mode"
                  [[ $mode == loop ]] || break
                  sleep 3600
              done
            - launcher
            - check
          initialDelaySeconds: 5
          periodSeconds: 60
          timeoutSeconds: 55
          failureThreshold: 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: script
          mountPath: /opt/mitigation
          readOnly: true
        - name: certs
          mountPath: /etc/ssl/certs
          readOnly: false
        - name: system-sources
          mountPath: /usr/share/ca-certificates
          readOnly: true
        - name: local-sources
          mountPath: /usr/local/share/ca-certificates
          readOnly: true
        - name: state
          mountPath: /var/lib/yc-emudhra-mitigation
          readOnly: false
        - name: work
          mountPath: /tmp
      volumes:
      - name: script
        configMap:
          name: emudhra-ca-mitigation
      - name: certs
        hostPath:
          path: /etc/ssl/certs
          type: Directory
      - name: system-sources
        hostPath:
          path: /usr/share/ca-certificates
          type: Directory
      - name: local-sources
        hostPath:
          path: /usr/local/share/ca-certificates
          type: Directory
      - name: state
        hostPath:
          path: /var/lib/yc-emudhra-mitigation
          type: DirectoryOrCreate
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
